name: Release Package

on:
  push:
    tags:
      - "v0.1.*"

permissions:
  contents: read
  packages: write

jobs:
  test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: movie-catalog:test
          platforms: linux/amd64

      - name: Start container
        run: |
          docker run -d \
            --name movie-catalog-test \
            -p 3000:3000 \
            -e DATABASE_URL=file:/app/data/movie-catalog.db \
            -e AUTH_SECRET=test-secret-for-ci \
            -e OMDB_API_KEY=test-key \
            movie-catalog:test

      - name: Check HTTP response
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:3000/register > /tmp/register.html; then
              exit 0
            fi
            sleep 2
          done
          docker logs movie-catalog-test
          exit 1

      - name: Check bundled database schema
        run: |
          cat > check-db.js <<'"'"'EOF'"'"'
          const Database = require("better-sqlite3");
          const db = new Database("/app/data/movie-catalog.db");
          const names = db
            .prepare("select name from sqlite_master where type = 'table' order by name")
            .all()
            .map((row) => row.name);
          if (!names.includes("User") || !names.includes("WatchEntry")) {
            console.error(names);
            process.exit(1);
          }
          EOF
          docker cp check-db.js movie-catalog-test:/check-db.js
          docker exec movie-catalog-test node /check-db.js

      - name: Clean up test container
        if: always()
        run: docker rm -f movie-catalog-test || true

  docker:
    needs: test-image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Normalize image name
        run: echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository_owner }}/catalog' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
