services:
  movie-catalog:
    image: ghcr.io/iyouknow/catalog:latest
    container_name: movie-catalog
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/movie-catalog.db
      AUTH_SECRET: change-me-to-a-long-random-string
      OMDB_API_KEY: your-omdb-api-key
    volumes:
      - /DATA/AppData/movie-catalog:/app/data
    restart: unless-stopped
